<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XiaoEmby</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --ink: #101828;
      --sub: #475467;
      --muted: #98a2b3;
      --line: #e4e7ec;
      --accent: #3538cd;
      --accent-bg: #eef2ff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
    }
    .container_wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }
    .logo img { width: 128px; height: auto; display: block; }
    .desc {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 40px;
      max-width: 520px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.3px;
    }
    h1::after {
      content: "";
      display: block;
      width: 36px;
      height: 2px;
      background: var(--accent);
      margin: 12px auto 0;
      border-radius: 2px;
    }
    .desc p { margin: 6px 0; font-size: 13px; color: var(--sub); }
    p.call { color: var(--ink); font-weight: 600; }
    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }
    .options .options_list {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      transition: border-color .15s, background .15s;
    }
    .options .options_list:hover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .options a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
    }
    footer {
      text-align: center;
      padding: 14px;
      color: var(--muted);
      font-size: 11px;
    }
    footer a { color: var(--sub); text-decoration: none; }
    footer a:hover { color: var(--accent); }
    @media screen and (max-width: 510px) {
      .logo img { width: 92px; }
      .desc { padding: 20px; }
      h1 { font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="container_wrapper">
    <div class="logo">
      <img src="/static/logowhite_1881.png" alt="XiaoEmby Logo" />
    </div>
    <div class="desc">
      <h1>谁家灯火夜通明</h1>
      <p class="call">小爱同学？</p>
      <p class="answer">哎，我在</p>
    </div>
    <div class="options">
      <div class="options_list">
        <a href="/static/default/index.html">默认主题</a>
      </div>
    </div>
  </div>
  <footer>
    Powered by <a href="https://github.com/backtracker/xiaoemby">XiaoEmby</a>
  </footer>
</body>

</html>
