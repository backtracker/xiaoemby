<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XiaoEmby</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --ink: #101828;
      --sub: #475467;
      --muted: #98a2b3;
      --line: #e4e7ec;
      --accent: #3538cd;
      --accent-bg: #eef2ff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(900px 520px at 12% 6%, rgba(99, 102, 241, .14), transparent 62%),
        radial-gradient(760px 480px at 88% 16%, rgba(56, 189, 248, .12), transparent 64%),
        radial-gradient(900px 600px at 50% 100%, rgba(53, 56, 205, .11), transparent 66%),
        linear-gradient(180deg, #fbfbff 0%, var(--bg) 55%, #f2f4ff 100%);
      color: var(--ink);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(53, 56, 205, .10) 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 76%, transparent);
      mask-image: linear-gradient(180deg, transparent, #000 22%, #000 76%, transparent);
    }
    .container_wrapper,
    footer {
      position: relative;
      z-index: 1;
    }
    .container_wrapper {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }
    .container_wrapper::before {
      content: "";
      position: absolute;
      width: 460px;
      height: 460px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -56%);
      background: radial-gradient(circle, rgba(99, 102, 241, .14), rgba(56, 189, 248, .05) 45%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3538cd, #6366f1);
      box-shadow: 0 10px 24px rgba(53, 56, 205, .22);
    }
    .logo img { width: 128px; height: auto; display: block; }
    .desc {
      text-align: center;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 28px 40px;
      max-width: 520px;
    }
    .desc p { margin: 5px 0; font-size: 13px; color: var(--sub); }
    p.call {
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -.2px;
    }
    p.answer { color: var(--sub); }
    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      min-height: 46px;
      padding: 8px 9px 8px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(53, 56, 205, .22);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .cta-button:hover {
      background: #2c2fbb;
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(53, 56, 205, .28);
    }
    .cta-button:focus-visible {
      outline: 3px solid rgba(53, 56, 205, .28);
      outline-offset: 3px;
    }
    .cta-label {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .01em;
    }
    .cta-arrow {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
    }
    .cta-hint {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 14px;
      color: var(--muted);
      font-size: 11px;
    }
    footer a { color: var(--sub); text-decoration: none; }
    footer a:hover { color: var(--accent); }
    @media screen and (max-width: 510px) {
      .logo img { width: 92px; }
      .desc { padding: 20px 26px; }
      p.call { font-size: 15px; }
    }
  </style>
</head>

<body>
  <div class="container_wrapper">
    <div class="logo">
      <img src="/static/logowhite_1881.png" alt="XiaoEmby Logo" />
    </div>
    <div class="desc">
      <p class="call">小爱同学？</p>
      <p class="answer">哎，我在</p>
    </div>
    <div class="cta">
      <a class="cta-button" href="/player">
        <span class="cta-label">打开控制台</span>
        <span class="cta-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </span>
      </a>
      <span class="cta-hint">播放控制 · 今日推荐 · 设置</span>
    </div>
  </div>
  <footer>
    Powered by <a href="https://github.com/backtracker/xiaoemby">XiaoEmby</a>
  </footer>
</body>

</html>
